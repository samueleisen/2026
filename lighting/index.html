<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lighting</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a0c10;
      color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.08) 0%, rgba(245, 158, 11, 0.02) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header Nav */
    header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 18px;
      background: rgba(18, 22, 30, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(-2px);
    }

    /* Main Showcase */
    .showcase-container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .img-wrapper {
      max-width: 100%;
      max-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: zoom-in;
    }

    .img-wrapper img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
    }

    .img-wrapper:hover img {
      transform: scale(1.02);
    }

    /* Modal for Fullscreen Zoom */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 10, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-close {
      position: absolute;
      top: 24px;
      right: 24px;
      color: #ffffff;
      font-size: 28px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>

  <header>
    <a href="../" class="back-btn">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Back
    </a>
  </header>

  <div class="showcase-container">
    <div class="img-wrapper" id="imgWrapper" title="Click to view full size">
      <img id="mainImage" src="./lantern.png" alt="Lighting Image" />
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="modal" id="imageModal">
    <div class="modal-close">&times;</div>
    <img id="modalImg" src="./lantern.png" alt="Lighting Image Full View" />
  </div>

  <script>
    const imgWrapper = document.getElementById('imgWrapper');
    const modal = document.getElementById('imageModal');

    imgWrapper.addEventListener('click', () => {
      modal.classList.add('active');
    });

    modal.addEventListener('click', () => {
      modal.classList.remove('active');
    });
  </script>
</body>

</html>
