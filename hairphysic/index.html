<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Model & Bone Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(18, 22, 30, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --bone-color: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphic UI Overlay */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Header Bar */
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1 span.badge {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(59, 130, 246, 0.3);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Top Right Tools & Drop zone */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-bone.active {
            background: var(--bone-color);
            border-color: var(--bone-color);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        .btn-collider.active {
            background: #0e7490;
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.45);
        }

        #file-input {
            display: none;
        }

        /* Main Floating Control Dock */
        .controls-dock {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px;
            display: flex;
            gap: 8px;
        }

        /* Side Panel: Bone Tree & Details */
        .sidebar {
            position: absolute;
            top: 80px;
            right: 20px;
            bottom: 80px;
            width: 320px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(350px);
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .bone-stats {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 11px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-color);
        }

        .bone-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .bone-list-container::-webkit-scrollbar {
            width: 6px;
        }

        .bone-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .bone-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            transition: background 0.15s ease;
            color: var(--text-muted);
        }

        .bone-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .bone-item.selected {
            background: rgba(236, 72, 153, 0.15);
            border: 1px solid rgba(236, 72, 153, 0.3);
            color: #f472b6;
            font-weight: 500;
        }

        .bone-tag {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Drag Overlay */
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--accent-color);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #drop-zone.active {
            opacity: 1;
            pointer-events: all;
        }

        #drop-zone p {
            font-size: 18px;
            font-weight: 500;
            margin-top: 12px;
        }

        /* Loading Indicator */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Hint Overlay */
        .hint-toast {
            position: absolute;
            bottom: 80px;
            left: 20px;
            z-index: 10;
            padding: 8px 14px;
            font-size: 11px;
            color: var(--text-muted);
            pointer-events: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="webgl-container"></div>

    <!-- Header -->
    <header class="glass-panel">
        <h1>
            GLB Viewer <span class="badge" id="model-name">test003rigged.glb</span>
        </h1>
    </header>

    <!-- Top Right Actions -->
    <div class="top-right-bar">
        <label for="file-input" class="btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
            </svg>
            Upload GLB
        </label>
        <input type="file" id="file-input" accept=".glb,.gltf">

        <button id="btn-toggle-sidebar" class="btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h7" />
            </svg>
            Bone Inspector
        </button>
    </div>

    <!-- Controls Dock -->
    <div class="controls-dock glass-panel">
        <div class="shading-group"
            style="display:flex; background:rgba(0,0,0,0.3); padding:3px; border-radius:8px; gap:4px; border:1px solid var(--panel-border);">
            <button id="btn-shade-pbr" class="btn active" style="padding:6px 12px; font-size:12px;"
                title="Original Textures & Materials">🎨 PBR</button>
            <button id="btn-shade-clay" class="btn" style="padding:6px 12px; font-size:12px;"
                title="Clay MatCap Shader for Motion & Form">🗿 Clay</button>
            <button id="btn-shade-normals" class="btn" style="padding:6px 12px; font-size:12px;"
                title="Surface Normals RGB">🌈 Normals</button>
        </div>

        <button id="btn-toggle-bones" class="btn btn-bone">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="6" cy="6" r="2" />
                <circle cx="18" cy="6" r="2" />
                <circle cx="12" cy="18" r="2" />
                <path d="M7.5 7.5l3 9M16.5 7.5l-3 9M8 6h8" />
            </svg>
            Skeleton
        </button>

        <button id="btn-toggle-wireframe" class="btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polygon points="12 2 2 7 12 12 22 7 12 2" />
                <polyline points="2 17 12 22 22 17" />
                <polyline points="2 12 12 17 22 12" />
            </svg>
            Wireframe
        </button>

        <button id="btn-toggle-colliders" class="btn btn-collider" title="Show / hide collision volumes">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" />
                <path d="M8 14c-3 1-5 3-5 5h18c0-2-2-4-5-5" />
                <ellipse cx="12" cy="19" rx="7" ry="2.5" />
            </svg>
            Colliders
        </button>

        <button id="btn-reset-cam" class="btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
            </svg>
            Reset
        </button>
    </div>

    <!-- Bone Detail Sidebar -->
    <aside id="sidebar" class="sidebar glass-panel collapsed">
        <div class="sidebar-header">
            <h2>Bone Hierarchy</h2>
            <span id="bone-count" class="badge"
                style="background: rgba(236,72,153,0.2); color:#f472b6; padding:2px 8px; border-radius:10px; font-size:11px;">0
                Bones</span>
        </div>
        <div class="bone-stats">
            <div class="stat-item">
                <span class="stat-label">Total Meshes</span>
                <span id="stat-meshes" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Vertices</span>
                <span id="stat-vertices" class="stat-value">0</span>
            </div>
        </div>
        <div class="bone-list-container" id="bone-list">
            <!-- Dynamically populated -->
        </div>
    </aside>

    <!-- Drag & Drop Overlay -->
    <div id="drop-zone">
        <svg width="48" height="48" fill="none" stroke="var(--accent-color)" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
        </svg>
        <p>Drop your GLB / GLTF file here</p>
    </div>

    <!-- Loader Spinner -->
    <div id="loader">
        <div class="spinner"></div>
        <span style="font-size:12px; color:var(--text-muted)">Loading 3D Model...</span>
    </div>

    <div class="hint-toast glass-panel">
        WASD: Move | SPACE: Jump | SHIFT: Sprint | Drag: Orbit | Scroll: Zoom | R: Reset
    </div>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { ViewHelper } from 'three/addons/helpers/ViewHelper.js';
        import { HairPhysics } from './hairphysic.js';
        import { HairColliderHelper } from './hair-herlper.js';

        // State Variables
        let scene, camera, renderer, controls, viewHelper;
        const clock = new THREE.Clock();
        const characterRoot = new THREE.Group();
        let currentModel = null;
        let skeletonHelper = null;
        let boneHighlightMarker = null;
        let bonesList = [];
        let isSkeletonVisible = false;
        let isWireframe = false;
        let selectedBoneNode = null;
        let currentShadingMode = 'pbr';
        const hairPhysics = new HairPhysics();
        let colliderHelper = null;   // HairColliderHelper — created on model load
        let isColliderVisible = false;

        // Character Movement & Physics State
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            jump: false,
            sprint: false
        };

        const charPhysics = {
            velocityY: 0,
            isGrounded: true,
            gravity: -24,
            jumpForce: 15.0,
            baseSpeed: 5.0,
            sprintMultiplier: 1.8,
            targetRotation: 0,
            currentRotation: 0,
            walkCycle: 0,
            movementVelocity: new THREE.Vector3()
        };

        // Procedural Clay MatCap Generator (ZBrush sculpt shading)
        function createMatCapTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(90, 80, 10, 128, 128, 128);
            grad.addColorStop(0, '#f7f3ed');
            grad.addColorStop(0.35, '#b5a79a');
            grad.addColorStop(0.75, '#66594d');
            grad.addColorStop(1, '#29221c');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            return new THREE.CanvasTexture(canvas);
        }

        const clayMatcapMaterial = new THREE.MeshMatcapMaterial({ matcap: createMatCapTexture() });
        const normalShaderMaterial = new THREE.MeshNormalMaterial();

        const container = document.getElementById('webgl-container');
        const loaderElem = document.getElementById('loader');
        const modelNameBadge = document.getElementById('model-name');
        const boneListContainer = document.getElementById('bone-list');
        const boneCountBadge = document.getElementById('bone-count');
        const statMeshes = document.getElementById('stat-meshes');
        const statVertices = document.getElementById('stat-vertices');
        const sidebar = document.getElementById('sidebar');

        init();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c10);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2.2, 4.5);

            // 3. Renderer Setup with Calibrated Exposure
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.85;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Environment Lighting (PMREM Studio Setup)
            const environment = new RoomEnvironment(renderer);
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(environment).texture;
            environment.dispose();

            // 5. Calibrated Studio Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
            keyLight.position.set(4, 8, 4);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.bias = -0.0001;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x90b0ff, 1.2);
            fillLight.position.set(-4, 4, -2);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
            rimLight.position.set(0, 5, -5);
            scene.add(rimLight);

            // 6. Floor & Grid Setup (Large area for character roaming)
            const gridHelper = new THREE.GridHelper(60, 60, 0x3b82f6, 0x1f2937);
            gridHelper.position.y = 0;
            gridHelper.material.opacity = 0.4;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            const shadowPlaneGeo = new THREE.PlaneGeometry(60, 60);
            const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.3 });
            const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.receiveShadow = true;
            scene.add(shadowPlane);

            // 7. Add Character Root container to Scene
            scene.add(characterRoot);

            // 8. Orbit Controls (Mouse Dragging)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 1.0;
            controls.maxDistance = 25;
            controls.target.set(0, 1.2, 0);
            controls.update();

            // 9. Bone Highlight Gizmo
            const markerGeo = new THREE.SphereGeometry(0.025, 16, 16);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xec4899, wireframe: true, depthTest: false, transparent: true, opacity: 0.9 });
            boneHighlightMarker = new THREE.Mesh(markerGeo, markerMat);
            boneHighlightMarker.visible = false;
            scene.add(boneHighlightMarker);

            // 10. Interactive 3D Navigation Gizmo
            viewHelper = new ViewHelper(camera, renderer.domElement);
            renderer.domElement.addEventListener('pointerdown', (event) => {
                if (viewHelper && viewHelper.handleClick(event)) {
                    controls.enabled = false;
                }
            });

            // 11. Load Default Model
            loadGLBModel('./test003rigged.glb', 'test003rigged.glb');

            // 12. Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupUIListeners();
            setupDragAndDrop();

            // 13. Render Loop
            animate();
        }

        function loadGLBModel(url, filename) {
            loaderElem.classList.remove('hidden');
            modelNameBadge.textContent = filename;

            const loader = new GLTFLoader();
            loader.load(
                url,
                (gltf) => {
                    // Remove previous model & skeleton
                    if (currentModel) {
                        characterRoot.remove(currentModel);
                        if (skeletonHelper) scene.remove(skeletonHelper);
                    }

                    currentModel = gltf.scene;

                    // Enable shadow casting & receiving on meshes
                    let meshCount = 0;
                    let vertCount = 0;
                    bonesList = [];

                    currentModel.traverse((child) => {
                        if (child.isMesh) {
                            meshCount++;
                            child.castShadow = true;
                            child.receiveShadow = true;
                            child.userData.originalMaterial = child.material;
                            if (child.geometry) {
                                vertCount += child.geometry.attributes.position ? child.geometry.attributes.position.count : 0;
                            }
                        }
                        if (child.isBone) {
                            bonesList.push(child);
                        }
                    });

                    // Center model base on root (Y = 0)
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());

                    currentModel.position.x -= center.x;
                    currentModel.position.z -= center.z;
                    currentModel.position.y -= box.min.y;

                    characterRoot.add(currentModel);
                    characterRoot.updateMatrixWorld(true);

                    // Re-apply active shading mode
                    applyShadingMode(currentShadingMode);

                    // Create Skeleton Helper
                    skeletonHelper = new THREE.SkeletonHelper(characterModelSafe(currentModel));
                    skeletonHelper.material.linewidth = 2;
                    skeletonHelper.material.depthTest = false;
                    skeletonHelper.material.transparent = true;
                    skeletonHelper.visible = isSkeletonVisible;
                    scene.add(skeletonHelper);

                    // Auto-adjust Camera
                    camera.position.set(0, 2.2, 4.5);
                    controls.target.set(0, 1.2, 0);
                    controls.update();

                    // Update UI Stats & Sidebar
                    statMeshes.textContent = meshCount;
                    statVertices.textContent = vertCount.toLocaleString();
                    boneCountBadge.textContent = `${bonesList.length} Bones`;
                    populateBoneList();

                    loaderElem.classList.add('hidden');

                    // Initialize hair physics from lead module
                    hairPhysics.reset();
                    hairPhysics.init(currentModel);

                    // (Re-)create the collider debug helper for the new model
                    if (colliderHelper) {
                        scene.remove(colliderHelper.group);
                        colliderHelper.dispose();
                    }
                    colliderHelper = hairPhysics.createDebugHelper();
                    colliderHelper.setVisible(isColliderVisible);
                    scene.add(colliderHelper.group);
                },
                (xhr) => { },
                (error) => {
                    console.error('Error loading GLB:', error);
                    loaderElem.classList.add('hidden');
                    alert('Failed to load GLB model.');
                }
            );
        }

        function characterModelSafe(model) {
            return model || characterRoot;
        }

        function populateBoneList() {
            boneListContainer.innerHTML = '';

            if (bonesList.length === 0) {
                boneListContainer.innerHTML = `<div style="padding:16px; text-align:center; color:var(--text-muted); font-size:12px;">No bone hierarchy found in model.</div>`;
                return;
            }

            bonesList.forEach((bone, index) => {
                const item = document.createElement('div');
                item.className = 'bone-item';
                item.innerHTML = `
                    <span>${bone.name || 'Bone_' + index}</span>
                    <span class="bone-tag">#${index + 1}</span>
                `;

                item.addEventListener('click', () => {
                    selectBone(bone, item);
                });

                boneListContainer.appendChild(item);
            });
        }

        function selectBone(bone, itemElem) {
            document.querySelectorAll('.bone-item').forEach(el => el.classList.remove('selected'));
            itemElem.classList.add('selected');
            selectedBoneNode = bone;

            // Highlight bone position with gizmo
            const worldPos = new THREE.Vector3();
            bone.getWorldPosition(worldPos);
            boneHighlightMarker.position.copy(worldPos);
            boneHighlightMarker.visible = true;

            // Smoothly move orbit controls target to bone position
            controls.target.copy(worldPos);
        }

        function resetCharacterPosition() {
            characterRoot.position.set(0, 0, 0);
            charPhysics.velocityY = 0;
            charPhysics.isGrounded = true;
            charPhysics.targetRotation = 0;
            charPhysics.currentRotation = 0;
            charPhysics.movementVelocity.set(0, 0, 0);
            characterRoot.rotation.y = 0;

            if (currentModel) {
                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                currentModel.position.x -= center.x;
                currentModel.position.z -= center.z;
                currentModel.position.y -= box.min.y;
                currentModel.rotation.set(0, 0, 0);
            }

            if (hairPhysics) hairPhysics.reset();

            camera.position.set(0, 2.2, 4.5);
            controls.target.set(0, 1.2, 0);
            controls.update();

            if (boneHighlightMarker) boneHighlightMarker.visible = false;
            document.querySelectorAll('.bone-item').forEach(el => el.classList.remove('selected'));
        }

        // 3rd Person Character Controller & Movement Update
        function updateCharacter(delta) {
            if (!currentModel) return;

            const inputX = (moveState.right ? 1 : 0) - (moveState.left ? 1 : 0);
            const inputZ = (moveState.backward ? 1 : 0) - (moveState.forward ? 1 : 0);
            const isMoving = inputX !== 0 || inputZ !== 0;

            if (isMoving) {
                const camAngle = Math.atan2(
                    camera.position.x - controls.target.x,
                    camera.position.z - controls.target.z
                );

                const inputAngle = Math.atan2(inputX, inputZ);
                charPhysics.targetRotation = camAngle + inputAngle;

                const currentSpeed = (charPhysics.baseSpeed * (moveState.sprint ? charPhysics.sprintMultiplier : 1.0));
                const speed = currentSpeed * delta;
                const moveDir = new THREE.Vector3(Math.sin(charPhysics.targetRotation), 0, Math.cos(charPhysics.targetRotation));

                charPhysics.movementVelocity.copy(moveDir).multiplyScalar(currentSpeed);

                // Move character root
                const prevPos = characterRoot.position.clone();
                characterRoot.position.addScaledVector(moveDir, speed);

                // Keep camera & controls target smoothly following character
                const displacement = characterRoot.position.clone().sub(prevPos);
                camera.position.add(displacement);
                controls.target.add(displacement);

                // Procedural walk bob & subtle lean
                charPhysics.walkCycle += delta * (moveState.sprint ? 14 : 9);
                const bobY = Math.abs(Math.sin(charPhysics.walkCycle)) * 0.05;
                const tiltZ = Math.sin(charPhysics.walkCycle) * 0.03;
                currentModel.position.y = bobY;
                currentModel.rotation.z = tiltZ;
            } else {
                charPhysics.movementVelocity.set(0, 0, 0);
                currentModel.position.y = THREE.MathUtils.lerp(currentModel.position.y, 0, delta * 10);
                currentModel.rotation.z = THREE.MathUtils.lerp(currentModel.rotation.z, 0, delta * 10);
            }

            // Smooth character rotation toward target angle
            let angleDiff = charPhysics.targetRotation - charPhysics.currentRotation;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            charPhysics.currentRotation += angleDiff * Math.min(delta * 12.0, 1.0);
            characterRoot.rotation.y = charPhysics.currentRotation;

            // Jump and Gravity Physics
            const prevY = characterRoot.position.y;
            if (!charPhysics.isGrounded) {
                charPhysics.velocityY += charPhysics.gravity * delta;
                characterRoot.position.y += charPhysics.velocityY * delta;
                charPhysics.movementVelocity.y = charPhysics.velocityY;

                if (characterRoot.position.y <= 0) {
                    characterRoot.position.y = 0;
                    charPhysics.velocityY = 0;
                    charPhysics.isGrounded = true;
                }
            }
            const deltaY = characterRoot.position.y - prevY;
            camera.position.y += deltaY;
            controls.target.y += deltaY;
        }

        function setupUIListeners() {
            // Skeleton Toggle
            const btnBones = document.getElementById('btn-toggle-bones');
            btnBones.addEventListener('click', () => {
                isSkeletonVisible = !isSkeletonVisible;
                btnBones.classList.toggle('active', isSkeletonVisible);
                if (skeletonHelper) {
                    skeletonHelper.visible = isSkeletonVisible;
                }
            });

            // Collider Debug Toggle
            const btnColliders = document.getElementById('btn-toggle-colliders');
            btnColliders.addEventListener('click', () => {
                isColliderVisible = !isColliderVisible;
                btnColliders.classList.toggle('active', isColliderVisible);
                if (colliderHelper) colliderHelper.setVisible(isColliderVisible);
            });

            // Wireframe Toggle
            const btnWire = document.getElementById('btn-toggle-wireframe');
            btnWire.addEventListener('click', () => {
                isWireframe = !isWireframe;
                btnWire.classList.toggle('active', isWireframe);
                if (currentModel) {
                    currentModel.traverse((child) => {
                        if (child.isMesh && child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.wireframe = isWireframe);
                            } else {
                                child.material.wireframe = isWireframe;
                            }
                        }
                    });
                }
            });

            // Reset Camera & Character View
            document.getElementById('btn-reset-cam').addEventListener('click', resetCharacterPosition);

            // Toggle Sidebar
            const btnSidebar = document.getElementById('btn-toggle-sidebar');
            btnSidebar.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                btnSidebar.classList.toggle('active', !sidebar.classList.contains('collapsed'));
            });

            // Shading Mode Switcher
            document.getElementById('btn-shade-pbr').addEventListener('click', () => applyShadingMode('pbr'));
            document.getElementById('btn-shade-clay').addEventListener('click', () => applyShadingMode('clay'));
            document.getElementById('btn-shade-normals').addEventListener('click', () => applyShadingMode('normals'));

            // File Upload Input
            const fileInput = document.getElementById('file-input');
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    loadGLBModel(url, file.name);
                }
            });

            // Keyboard Navigation (WASD / Space / Shift / R)
            window.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        moveState.forward = true;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        moveState.backward = true;
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        moveState.left = true;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        moveState.right = true;
                        break;
                    case 'Space':
                        if (charPhysics.isGrounded) {
                            charPhysics.velocityY = charPhysics.jumpForce;
                            charPhysics.isGrounded = false;
                        }
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        moveState.sprint = true;
                        break;
                    case 'KeyR':
                        resetCharacterPosition();
                        break;
                }
            });

            window.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        moveState.forward = false;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        moveState.backward = false;
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        moveState.left = false;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        moveState.right = false;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        moveState.sprint = false;
                        break;
                }
            });
        }

        function applyShadingMode(mode) {
            currentShadingMode = mode;
            if (!currentModel) return;

            currentModel.traverse((child) => {
                if (child.isMesh) {
                    if (mode === 'pbr') {
                        child.material = child.userData.originalMaterial;
                    } else if (mode === 'clay') {
                        child.material = clayMatcapMaterial;
                    } else if (mode === 'normals') {
                        child.material = normalShaderMaterial;
                    }

                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.wireframe = isWireframe);
                        } else {
                            child.material.wireframe = isWireframe;
                        }
                    }
                }
            });

            document.getElementById('btn-shade-pbr').classList.toggle('active', mode === 'pbr');
            document.getElementById('btn-shade-clay').classList.toggle('active', mode === 'clay');
            document.getElementById('btn-shade-normals').classList.toggle('active', mode === 'normals');
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');

            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('active');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('active');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('active');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    const file = e.dataTransfer.files[0];
                    if (file.name.endsWith('.glb') || file.name.endsWith('.gltf')) {
                        const url = URL.createObjectURL(file);
                        loadGLBModel(url, file.name);
                    } else {
                        alert('Please drop a valid .glb or .gltf file.');
                    }
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            // 1. Update WASD Character Movement & Physics
            updateCharacter(delta);

            // 2. Update Hair Chain Physics from Lead Module
            if (hairPhysics) {
                characterRoot.updateMatrixWorld(true);
                hairPhysics.update(delta);

                // Sync collider debug meshes with live physics state
                if (colliderHelper && isColliderVisible) colliderHelper.update();
            }

            // 3. Update ViewHelper animation or OrbitControls
            if (viewHelper && viewHelper.animating) {
                viewHelper.center.copy(controls.target);
                viewHelper.update(delta);
            } else {
                controls.enabled = true;
            }

            controls.update();

            // 4. Update selected bone marker position if bone is animated or moved
            if (selectedBoneNode && boneHighlightMarker.visible) {
                const worldPos = new THREE.Vector3();
                selectedBoneNode.getWorldPosition(worldPos);
                boneHighlightMarker.position.copy(worldPos);
            }

            // 5. Render scene and overlay navigation gizmo
            renderer.autoClear = false;
            renderer.clear();
            renderer.render(scene, camera);
            if (viewHelper) {
                viewHelper.render(renderer);
            }
        }
    </script>
</body>

</html>
