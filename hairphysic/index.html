<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Model & Bone Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(18, 22, 30, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --bone-color: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphic UI Overlay */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Header Bar */
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1 span.badge {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(59, 130, 246, 0.3);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Top Right Tools & Drop zone */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-bone.active {
            background: var(--bone-color);
            border-color: var(--bone-color);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        .btn-collider.active {
            background: #0e7490;
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.45);
        }

        #file-input {
            display: none;
        }

        /* Main Floating Control Dock */
        .controls-dock {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px;
            display: flex;
            gap: 8px;
        }

        /* Side Panel: Bone Tree & Details */
        .sidebar {
            position: absolute;
            top: 80px;
            right: 20px;
            bottom: 80px;
            width: 320px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(350px);
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .bone-stats {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 11px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-color);
        }

        .bone-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .bone-list-container::-webkit-scrollbar {
            width: 6px;
        }

        .bone-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .bone-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            transition: background 0.15s ease;
            color: var(--text-muted);
        }

        .bone-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .bone-item.selected {
            background: rgba(236, 72, 153, 0.15);
            border: 1px solid rgba(236, 72, 153, 0.3);
            color: #f472b6;
            font-weight: 500;
        }

        .bone-tag {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Drag Overlay */
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--accent-color);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #drop-zone.active {
            opacity: 1;
            pointer-events: all;
        }

        #drop-zone p {
            font-size: 18px;
            font-weight: 500;
            margin-top: 12px;
        }

        /* Loading Indicator */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Hint Overlay */
        .hint-toast {
            position: absolute;
            bottom: 80px;
            left: 20px;
            z-index: 10;
            padding: 8px 14px;
            font-size: 11px;
            color: var(--text-muted);
            pointer-events: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="webgl-container"></div>

    <!-- Header -->
    <header class="glass-panel">
        <a href="../"
            style="color: var(--text-muted); text-decoration: none; font-size: 12px; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); border: 1px solid var(--panel-border); transition: all 0.2s;"
            onmouseover="this.style.color='#fff'; this.style.borderColor='rgba(255,255,255,0.3)'"
            onmouseout="this.style.color='var(--text-muted)'; this.style.borderColor='var(--panel-border)'">← Portal</a>
        <h1>
            GLB Viewer <span class="badge" id="model-name">test003rigged.glb</span>
        </h1>
    </header>

    <!-- Top Right Actions -->
    <div class="top-right-bar">
        <label for="file-input" class="btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
            </svg>
            Upload GLB
        </label>
        <input type="file" id="file-input" accept=".glb,.gltf">

        <button id="btn-toggle-sidebar" class="btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h7" />
            </svg>
            Bone Inspector
        </button>
    </div>

    <!-- Controls Dock -->
    <div class="controls-dock glass-panel">
        <div class="shading-group"
            style="display:flex; background:rgba(0,0,0,0.3); padding:3px; border-radius:8px; gap:4px; border:1px solid var(--panel-border);">
            <button id="btn-shade-pbr" class="btn" style="padding:6px 12px; font-size:12px;"
                title="Original Textures & Materials">🎨 PBR</button>
            <button id="btn-shade-clay" class="btn" style="padding:6px 12px; font-size:12px;"
                title="Clay MatCap Shader for Motion & Form">🗿 Clay</button>
            <button id="btn-shade-normals" class="btn active" style="padding:6px 12px; font-size:12px;"
                title="Surface Normals RGB">🌈 Normals</button>
        </div>

        <button id="btn-toggle-bones" class="btn btn-bone">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="6" cy="6" r="2" />
                <circle cx="18" cy="6" r="2" />
                <circle cx="12" cy="18" r="2" />
                <path d="M7.5 7.5l3 9M16.5 7.5l-3 9M8 6h8" />
            </svg>
            Skeleton
        </button>

        <button id="btn-toggle-wireframe" class="btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polygon points="12 2 2 7 12 12 22 7 12 2" />
                <polyline points="2 17 12 22 22 17" />
                <polyline points="2 12 12 17 22 12" />
            </svg>
            Wireframe
        </button>

        <button id="btn-toggle-colliders" class="btn btn-collider" title="Show / hide collision volumes">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" />
                <path d="M8 14c-3 1-5 3-5 5h18c0-2-2-4-5-5" />
                <ellipse cx="12" cy="19" rx="7" ry="2.5" />
            </svg>
            Colliders
        </button>
    </div>

    <!-- Bone Detail Sidebar -->
    <aside id="sidebar" class="sidebar glass-panel collapsed">
        <div class="sidebar-header">
            <h2>Bone Hierarchy</h2>
            <span id="bone-count" class="badge"
                style="background: rgba(236,72,153,0.2); color:#f472b6; padding:2px 8px; border-radius:10px; font-size:11px;">0
                Bones</span>
        </div>
        <div class="bone-stats">
            <div class="stat-item">
                <span class="stat-label">Total Meshes</span>
                <span id="stat-meshes" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Vertices</span>
                <span id="stat-vertices" class="stat-value">0</span>
            </div>
        </div>
        <div class="bone-list-container" id="bone-list">
            <!-- Dynamically populated -->
        </div>
    </aside>

    <!-- Drag & Drop Overlay -->
    <div id="drop-zone">
        <svg width="48" height="48" fill="none" stroke="var(--accent-color)" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
        </svg>
        <p>Drop your GLB / GLTF file here</p>
    </div>

    <!-- Loader Spinner -->
    <div id="loader">
        <div class="spinner"></div>
        <span style="font-size:12px; color:var(--text-muted)">Loading 3D Model...</span>
    </div>

    <div class="hint-toast glass-panel">
        WASD: Move | SPACE: Jump
    </div>

    <!-- Application Script -->
    <script type="module" src="./app.js"></script>
</body>

</html>
