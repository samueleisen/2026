<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A 3D interactive game with smooth WASD movement, orthographic camera, and real 3D depth built with Three.js.">
    <title>3D Farmland</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="ui-overlay">
        <div id="perf-hud" style="pointer-events: auto;">
            FPS: <span class="perf-fps" style="color:#5cf0a0; font-weight:bold;">--</span>
        </div>
        <div id="coords" style="margin-top: 4px; opacity: 0.8;">x: 0 &nbsp; z: 0</div>
    </div>

    <div id="camera-panel">
        <h3>Settings</h3>

        <div class="control-group">
            <label>Grass Density</label>
            <select id="ctrl-grass-density">
                <option value="320000">Ultra Dense Horizon (320,000 blades)</option>
                <option value="160000">Extreme Horizon (160,000 blades)</option>
                <option value="80000" selected>Rock-Solid Horizon (80,000 blades)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Player Speed: <span id="val-player-speed" class="control-value">120</span></label>
            <input type="range" id="ctrl-player-speed" min="120" max="1200" step="10" value="120">
        </div>

        <div class="control-group" style="border-top: 1px solid rgba(200, 255, 200, 0.15); padding-top: 8px;">
            <label>Ambient Wind SFX: <span id="wind-audio-status" style="color: #ffb050; float: right;">Click to
                    enable</span></label>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                <input type="range" id="ctrl-wind-vol" min="0" max="1" step="0.05" value="0.05" style="flex: 1;">
                <span id="val-wind-vol" class="control-value" style="min-width: 35px; text-align: right;">5%</span>
            </div>
            <label
                style="display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer; user-select: none;">
                <input type="checkbox" id="ctrl-wind-mute" style="width: auto; cursor: pointer;">
                Mute Wind SFX
            </label>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Foundation -->
    <script src="js/constants.js"></script>
    <script src="js/perfBuffer.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/horizonSink.js"></script>

    <!-- World & Landscape -->
    <script src="js/world.js"></script>
    <script src="js/grass.js"></script>
    <script src="js/sky.js"></script>

    <!-- Character & Systems -->
    <script src="js/player.js"></script>
    <script src="js/ponytailPhysics.js"></script>
    <script src="js/input.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/playerController.js"></script>
    <script src="js/camera.js"></script>

    <!-- Game Loop -->
    <script src="js/loop.js"></script>
</body>

</html>
