<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM — Creative Lab</title>
<meta name="description" content="A spatial 3D portal showcasing creative coding experiments in Three.js, shaders, and interactive graphics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: #000;
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    cursor: default;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ─── Fade-in overlay ─── */
  #fade-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    pointer-events: none;
  }

  /* ─── UI Layer ─── */
  #ui-layer {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #ui-layer.visible { opacity: 1; }

  /* Title */
  #site-title {
    position: absolute;
    top: 36px;
    left: 40px;
    pointer-events: auto;
  }
  #site-title h1 {
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  #site-title .accent {
    color: rgba(255,255,255,0.9);
    font-weight: 500;
  }

  /* Explore CTA */
  #explore-cta {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
    cursor: pointer;
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
    padding: 12px 24px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 2px;
    backdrop-filter: blur(8px);
    transition: all 0.4s ease;
  }
  #explore-cta:hover {
    color: rgba(255,255,255,0.9);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
  }
  #explore-cta .bracket {
    display: inline-block;
    animation: bracketPulse 2.4s ease-in-out infinite;
  }
  #explore-cta .bracket.right { animation-delay: 0.15s; }
  @keyframes bracketPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Social Links */
  #social-links {
    position: absolute;
    top: 36px;
    right: 40px;
    display: flex;
    gap: 20px;
    pointer-events: auto;
  }
  #social-links a {
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.3s ease;
  }
  #social-links a:hover { color: rgba(255,255,255,0.8); }

  /* FPS Counter (dev) */
  #fps-counter {
    position: absolute;
    bottom: 36px;
    right: 40px;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.2);
    font-variant-numeric: tabular-nums;
  }

  /* Monolith label */
  #monolith-label {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 2px;
    opacity: 0;
    transform: translateX(-50%);
    transition: opacity 0.3s ease;
    white-space: nowrap;
  }
  #monolith-label.visible { opacity: 1; }
</style>
</head>
<body>

<div id="fade-overlay"></div>

<div id="canvas-container"></div>

<div id="ui-layer">
  <div id="site-title">
    <h1><span class="accent">SAM</span> — Creative Lab</h1>
  </div>

  <button id="explore-cta">
    <span class="bracket">[</span>&nbsp; EXPLORE &nbsp;<span class="bracket right">]</span>
  </button>

  <div id="social-links">
    <a href="https://github.com" target="_blank" rel="noopener">Github</a>
  </div>

  <div id="fps-counter">-- FPS</div>
</div>

<div id="monolith-label"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.168.0",
    "three/addons/": "https://esm.sh/three@0.168.0/examples/jsm/",
    "gsap": "https://esm.sh/gsap@3.12.5"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import gsap from 'gsap';

// ─────────────────────────────────────────────
// SETUP
// ─────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020208);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 40);
camera.lookAt(0, 2, 0);

// ─────────────────────────────────────────────
// POST-PROCESSING
// ─────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.2,   // strength
  0.7,   // radius
  0.3    // threshold
);
composer.addPass(bloomPass);

// ─────────────────────────────────────────────
// ORBIT CONTROLS
// ─────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.25;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 18;
controls.maxDistance = 55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.target.set(0, 2, 0);
controls.enabled = false; // disabled during intro

// ─────────────────────────────────────────────
// LAYER 1: STARFIELD
// ─────────────────────────────────────────────
function createStarfield() {
  const starsGeometry = new THREE.BufferGeometry();
  const count = 3000;
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const phases = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const r = 150 + Math.random() * 250;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    sizes[i] = 0.5 + Math.random() * 2.0;
    phases[i] = Math.random() * Math.PI * 2;
  }

  starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starsGeometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  starsGeometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

  const starsMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() }
    },
    vertexShader: `
      attribute float aSize;
      attribute float aPhase;
      uniform float uTime;
      uniform float uPixelRatio;
      varying float vTwinkle;

      void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vTwinkle = 0.5 + 0.5 * sin(uTime * 0.8 + aPhase);
        gl_PointSize = aSize * uPixelRatio * (200.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying float vTwinkle;

      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float alpha = smoothstep(0.5, 0.0, d) * vTwinkle;
        gl_FragColor = vec4(vec3(0.85, 0.88, 1.0), alpha * 0.8);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const stars = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(stars);
  return { mesh: stars, material: starsMaterial };
}

const starfield = createStarfield();

// Deep stars (slower rotation)
function createDeepStars() {
  const geo = new THREE.BufferGeometry();
  const count = 1500;
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const r = 350 + Math.random() * 150;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    color: 0x6677aa,
    size: 0.6,
    transparent: true,
    opacity: 0.4,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return pts;
}

const deepStars = createDeepStars();

// ─────────────────────────────────────────────
// LAYER 2: CYBER-GRID GROUND PLANE
// ─────────────────────────────────────────────
function createCyberGrid() {
  const gridGeo = new THREE.PlaneGeometry(300, 300, 150, 150);
  gridGeo.rotateX(-Math.PI / 2);

  const gridMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0x1a3a5c) },
      uPulseColor: { value: new THREE.Color(0x4488cc) }
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vWorldPos;

      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor;
      uniform vec3 uPulseColor;
      varying vec2 vUv;
      varying vec3 vWorldPos;

      void main() {
        // Grid lines
        vec2 worldXZ = vWorldPos.xz;
        vec2 grid = abs(fract(worldXZ * 0.5 + uTime * 0.05) - 0.5);
        float line = min(grid.x, grid.y);
        float gridLine = 1.0 - smoothstep(0.0, 0.03, line);

        // Distance fade
        float dist = length(vWorldPos.xz);
        float fade = 1.0 - smoothstep(10.0, 140.0, dist);

        // Pulse wave (expands outward)
        float pulse = sin(dist * 0.15 - uTime * 1.5) * 0.5 + 0.5;
        pulse = pow(pulse, 8.0);

        vec3 color = mix(uColor, uPulseColor, pulse * 0.6);

        float alpha = gridLine * fade * 0.55;
        alpha += pulse * fade * 0.08;

        gl_FragColor = vec4(color, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  const grid = new THREE.Mesh(gridGeo, gridMat);
  grid.position.y = -2;
  scene.add(grid);
  return { mesh: grid, material: gridMat };
}

const cyberGrid = createCyberGrid();

// ─────────────────────────────────────────────
// LAYER 3: CRYSTAL MONOLITHS
// ─────────────────────────────────────────────
const monolithData = [
  { name: 'GRASS',       color: 0x44ddaa, pos: [-12, 3.5, -8],  scale: [1.2, 6.5, 1.2],  rotZ: 0.08  },
  { name: 'HAIR PHYSICS',color: 0xdd66aa, pos: [10, 4.0, -12],  scale: [1.0, 7.0, 1.0],  rotZ: -0.06 },
  { name: 'FLUIDS',      color: 0x4488ff, pos: [-6, 2.8, -20],  scale: [1.4, 5.5, 1.4],  rotZ: 0.04  },
  { name: 'PARTICLES',   color: 0xffaa33, pos: [16, 3.2, -6],   scale: [0.9, 5.8, 0.9],  rotZ: -0.1  },
  { name: 'NOISE',       color: 0xaa55ff, pos: [-18, 3.0, -15], scale: [1.1, 6.0, 1.1],  rotZ: 0.12  },
  { name: 'RAYMARCHING', color: 0x33ddff, pos: [6, 3.8, -24],   scale: [1.3, 7.2, 1.3],  rotZ: -0.03 },
  { name: 'TERRAIN',     color: 0xff5566, pos: [-14, 2.5, -28], scale: [1.5, 5.0, 1.5],  rotZ: 0.07  },
];

const monolithGroup = new THREE.Group();
const monolithMeshes = [];
const monolithTargetEmissive = [];

const envMapLoader = new THREE.CubeTextureLoader();
// Procedural env map using PMREMGenerator
const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();

// Create a simple procedural environment
const envScene = new THREE.Scene();
const envGeo = new THREE.IcosahedronGeometry(1, 1);
const envColors = [0x111133, 0x221144, 0x0a0a2a];
for (let i = 0; i < 20; i++) {
  const mat = new THREE.MeshBasicMaterial({
    color: envColors[i % envColors.length],
    side: THREE.BackSide
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(50, 8, 8), mat);
  envScene.add(m);
}
const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
pmremGenerator.dispose();

monolithData.forEach((data, i) => {
  const geo = new THREE.BoxGeometry(1, 1, 1, 1, 1, 1);

  const color = new THREE.Color(data.color);

  const mat = new THREE.MeshPhysicalMaterial({
    color: color,
    metalness: 0.05,
    roughness: 0.05,
    transmission: 0.92,
    thickness: 3.0,
    ior: 1.8,
    iridescence: 1.0,
    iridescenceIOR: 1.5,
    iridescenceThicknessRange: [100, 800],
    envMap: envMap,
    envMapIntensity: 1.5,
    emissive: color,
    emissiveIntensity: 0.15,
    transparent: true,
    side: THREE.DoubleSide,
    attenuationColor: color,
    attenuationDistance: 2.0
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(...data.scale);
  mesh.position.set(...data.pos);
  mesh.rotation.z = data.rotZ;
  mesh.userData = { name: data.name, index: i, baseEmissive: 0.15, phase: Math.random() * Math.PI * 2 };

  // Point light child
  const light = new THREE.PointLight(data.color, 2.0, 25, 2);
  light.position.set(0, 0, 0);
  mesh.add(light);

  // Edge glow wireframe
  const edges = new THREE.EdgesGeometry(geo);
  const edgeMat = new THREE.LineBasicMaterial({
    color: data.color,
    transparent: true,
    opacity: 0.25
  });
  const edgeLines = new THREE.LineSegments(edges, edgeMat);
  edgeLines.scale.copy(mesh.scale);
  edgeLines.position.copy(mesh.position);
  edgeLines.rotation.copy(mesh.rotation);
  monolithGroup.add(edgeLines);
  mesh.userData.edgeLines = edgeLines;
  mesh.userData.edgeMat = edgeMat;

  monolithGroup.add(mesh);
  monolithMeshes.push(mesh);
  monolithTargetEmissive.push(0.15);
});

scene.add(monolithGroup);

// ─────────────────────────────────────────────
// LAYER 4: ATMOSPHERIC PARTICLES (dust / data debris)
// ─────────────────────────────────────────────
function createDustParticles() {
  const geo = new THREE.BufferGeometry();
  const count = 800;
  const positions = new Float32Array(count * 3);
  const velocities = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    positions[i * 3]     = (Math.random() - 0.5) * 80;
    positions[i * 3 + 1] = Math.random() * 30 - 2;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 80;
    velocities[i * 3]     = (Math.random() - 0.5) * 0.003;
    velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.002;
    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.003;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    color: 0x8899bb,
    size: 0.15,
    transparent: true,
    opacity: 0.35,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return { mesh: pts, velocities };
}

const dust = createDustParticles();

// ─────────────────────────────────────────────
// AMBIENT LIGHTING
// ─────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x334466, 0.8);
scene.add(ambientLight);

const directional = new THREE.DirectionalLight(0x6688bb, 0.5);
directional.position.set(10, 20, 10);
scene.add(directional);

// ─────────────────────────────────────────────
// RAYCASTER (hover detection)
// ─────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const mouseTarget = { x: 0, y: 0 };
let hoveredMonolith = null;
const label = document.getElementById('monolith-label');

function onMouseMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  mouseTarget.x = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseTarget.y = (e.clientY / window.innerHeight - 0.5) * 2;

  // Update label position
  label.style.left = e.clientX + 'px';
  label.style.top = (e.clientY - 40) + 'px';
}
window.addEventListener('mousemove', onMouseMove);

// ─────────────────────────────────────────────
// INTRO ANIMATION
// ─────────────────────────────────────────────
const fadeOverlay = document.getElementById('fade-overlay');
const uiLayer = document.getElementById('ui-layer');

// Start camera far back and high
camera.position.set(0, 25, 70);

const introTl = gsap.timeline({ delay: 0.3 });

// Fade from black
introTl.to(fadeOverlay, {
  opacity: 0,
  duration: 2.5,
  ease: 'power2.inOut',
  onComplete: () => { fadeOverlay.style.display = 'none'; }
});

// Camera push-in
introTl.to(camera.position, {
  x: 0,
  y: 8,
  z: 35,
  duration: 4.0,
  ease: 'power3.inOut',
}, 0.2);

// Show UI
introTl.add(() => {
  uiLayer.classList.add('visible');
  controls.enabled = true;
}, 3.0);

// ─────────────────────────────────────────────
// ANIMATION LOOP
// ─────────────────────────────────────────────
const clock = new THREE.Clock();
let frameCount = 0;
let lastFpsTime = 0;
const fpsEl = document.getElementById('fps-counter');

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // FPS counter
  frameCount++;
  if (t - lastFpsTime >= 1.0) {
    fpsEl.textContent = frameCount + ' FPS';
    frameCount = 0;
    lastFpsTime = t;
  }

  // Update star twinkle
  starfield.material.uniforms.uTime.value = t;

  // Rotate starfield layers
  starfield.mesh.rotation.y = t * 0.008;
  deepStars.rotation.y = t * 0.003;

  // Update cyber-grid
  cyberGrid.material.uniforms.uTime.value = t;

  // Monolith bobbing + hover emissive
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(monolithMeshes);

  let newHovered = null;
  if (intersects.length > 0) {
    newHovered = intersects[0].object;
  }

  monolithMeshes.forEach((mesh, i) => {
    // Bobbing
    const phase = mesh.userData.phase;
    mesh.position.y = monolithData[i].pos[1] + Math.sin(t * 0.6 + phase) * 0.5;
    mesh.rotation.y = t * 0.1 + phase;

    // Edge lines follow
    const edgeLines = mesh.userData.edgeLines;
    if (edgeLines) {
      edgeLines.position.copy(mesh.position);
      edgeLines.rotation.copy(mesh.rotation);
    }

    // Emissive hover
    const isHovered = mesh === newHovered;
    const targetEmissive = isHovered ? 0.8 : 0.15;
    const targetEdgeOpacity = isHovered ? 0.7 : 0.25;
    const currentEmissive = mesh.material.emissiveIntensity;
    mesh.material.emissiveIntensity += (targetEmissive - currentEmissive) * 0.08;

    // Edge opacity
    if (mesh.userData.edgeMat) {
      mesh.userData.edgeMat.opacity += (targetEdgeOpacity - mesh.userData.edgeMat.opacity) * 0.08;
    }

    // Scale pulse on hover
    const targetScale = isHovered ? 1.08 : 1.0;
    mesh.scale.x += (monolithData[i].scale[0] * targetScale - mesh.scale.x) * 0.06;
    mesh.scale.y += (monolithData[i].scale[1] * targetScale - mesh.scale.y) * 0.06;
    mesh.scale.z += (monolithData[i].scale[2] * targetScale - mesh.scale.z) * 0.06;

    // Point light intensity
    const light = mesh.children[0];
    if (light) {
      const targetIntensity = isHovered ? 5.0 : 2.0;
      light.intensity += (targetIntensity - light.intensity) * 0.08;
    }
  });

  // Update hover state & label
  if (newHovered !== hoveredMonolith) {
    hoveredMonolith = newHovered;
    if (hoveredMonolith) {
      label.textContent = hoveredMonolith.userData.name;
      label.classList.add('visible');
      renderer.domElement.style.cursor = 'pointer';
    } else {
      label.classList.remove('visible');
      renderer.domElement.style.cursor = 'default';
    }
  }

  // Dust particle drift
  const dustPos = dust.mesh.geometry.attributes.position;
  for (let i = 0; i < dustPos.count; i++) {
    dustPos.array[i * 3]     += dust.velocities[i * 3];
    dustPos.array[i * 3 + 1] += dust.velocities[i * 3 + 1];
    dustPos.array[i * 3 + 2] += dust.velocities[i * 3 + 2];

    // Wrap around
    if (Math.abs(dustPos.array[i * 3]) > 40) dust.velocities[i * 3] *= -1;
    if (dustPos.array[i * 3 + 1] > 28 || dustPos.array[i * 3 + 1] < -2) dust.velocities[i * 3 + 1] *= -1;
    if (Math.abs(dustPos.array[i * 3 + 2]) > 40) dust.velocities[i * 3 + 2] *= -1;
  }
  dustPos.needsUpdate = true;

  // Mouse parallax (subtle camera offset)
  if (controls.enabled) {
    controls.update();
  }

  // Render with bloom
  composer.render();
}

animate();

// ─────────────────────────────────────────────
// RESIZE HANDLER
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.resolution.set(window.innerWidth, window.innerHeight);
});

// ─────────────────────────────────────────────
// CLICK HANDLER (placeholder for navigation)
// ─────────────────────────────────────────────
renderer.domElement.addEventListener('click', () => {
  if (hoveredMonolith) {
    const name = hoveredMonolith.userData.name;
    console.log(`[Portal] Clicked: ${name}`);
    // Future: navigate to project page
    // window.location.href = `/${name.toLowerCase().replace(/\s+/g, '')}/`;
  }
});
</script>
